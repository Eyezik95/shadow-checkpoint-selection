[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bercheck"
version = "0.1.0"
description = "Checkpoint-selection rules, scene-bootstrap intervals, seed variance and minimum detectable differences for BER-scored segmentation benchmarks (shadow detection)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bercheck = "bercheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
